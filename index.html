<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Gesture Particle System</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            cursor: pointer; /* Indicates the background is clickable */
        }
        #webcam {
            display: none;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
            border-radius: 16px;
            width: 280px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            pointer-events: auto; /* Stops UI clicks from accidentally toggling fullscreen */
        }
        h2 {
            margin: 0 0 18px 0;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
            color: #00ffcc;
        }
        .control-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            margin-bottom: 8px;
        }
        select, input[type="color"] {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.25s ease;
        }
        select:hover, input[type="color"]:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(0, 255, 204, 0.4);
        }
        input[type="color"] {
            height: 44px;
            padding: 2px;
        }
        #monitor-window {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 180px;
            height: 135px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            overflow: hidden;
            z-index: 10;
            background: #000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transform: scaleX(-1);
        }
        #output_canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #status-toast {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 255, 204, 0.15);
            border: 1px solid rgb(0, 255, 204);
            color: #fff;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 13px;
            z-index: 10;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,255,204,0.2);
            transition: opacity 0.6s ease;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-container">
        <h2>Particle Core</h2>
        <div class="control-group">
            <label for="template-select">Active Shape Template</label>
            <select id="template-select">
                <option value="saturn">Saturn Planetary Ring</option>
                <option value="heart">Ethereal Heart</option>
                <option value="flower">Mathematical Flower</option>
                <option value="fireworks">Quantum Fireworks</option>
                <option value="buddha">Buddha Lotus Matrix</option>
                <option value="statue">Abstract Monolith Statue</option>
            </select>
        </div>
        <div class="control-group">
            <label for="color-picker">Particle Hex Color</label>
            <input type="color" id="color-picker" value="#00ffcc">
        </div>
        <div class="control-group" style="margin-top: 22px; font-size: 12px; color: #999; line-height: 1.6;">
            <strong>Controls:</strong><br>
            • Click the background to toggle Fullscreen.<br>
            • Move hands apart/together to scale particles.
        </div>
    </div>

    <div id="monitor-window">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div id="status-toast">Downloading Computer Vision Engines...</div>

    <script>
        // --- GLOBAL SETTINGS & STATE ---
        let scene, camera, renderer, particleSystem;
        let handsEngine = undefined;
        let webcamRunning = false;
        const PARTICLE_COUNT = 35000;
        
        let currentScale = 1.0;
        let targetScale = 1.0;
        let baseColor = new THREE.Color("#00ffcc");
        let activeShape = "saturn";

        const video = document.getElementById("webcam");
        const canvasElement = document.getElementById("output_canvas");
        const canvasCtx = canvasElement.getContext("2d");
        const statusToast = document.getElementById("status-toast");
        const container = document.getElementById('canvas-container');

        // --- 1. INITIALIZE COMPUTER VISION TRACKING ENGINE ---
        function initializeHandTracking() {
            try {
                if (typeof Hands === 'undefined') {
                    throw new Error("MediaPipe components missing from context pipeline scope.");
                }

                handsEngine = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });

                handsEngine.setOptions({
                    maxNumHands: 2,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                handsEngine.onResults(onHandTrackingResults);

                statusToast.innerText = "Tracking Engine Live. Requesting Webcam Layer...";
                startCameraStream();
            } catch (error) {
                statusToast.style.background = "rgba(255, 0, 0, 0.2)";
                statusToast.style.borderColor = "rgb(255, 0, 0)";
                statusToast.innerHTML = `Initialization Error: Check local network routing permissions.`;
                console.error(error);
            }
        }

        function startCameraStream() {
            const cameraUtilsInstance = new Camera(video, {
                onFrame: async () => {
                    if (handsEngine) {
                        await handsEngine.send({ image: video });
                    }
                },
                width: 640,
                height: 480
            });

            cameraUtilsInstance.start()
                .then(() => {
                    webcamRunning = true;
                    statusToast.innerText = "Click anywhere on the dark space to Fullscreen!";
                    setTimeout(() => statusToast.style.opacity = 0, 5000);
                })
                .catch((err) => {
                    statusToast.style.background = "rgba(255, 0, 0, 0.2)";
                    statusToast.style.borderColor = "rgb(255, 0, 0)";
                    statusToast.innerText = "Webcam Access Blocked! Enable camera permissions.";
                    console.error(err);
                });
        }

        function onHandTrackingResults(results) {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length >= 2) {
                const hand1 = results.multiHandLandmarks[0][9]; 
                const hand2 = results.multiHandLandmarks[1][9];

                const dx = hand1.x - hand2.x;
                const dy = hand1.y - hand2.y;
                const dz = hand1.z - hand2.z;
                const rawDistance = Math.sqrt(dx*dx + dy*dy + dz*dz);

                targetScale = THREE.MathUtils.mapLinear(rawDistance, 0.12, 0.65, 0.3, 3.0);
                targetScale = THREE.MathUtils.clamp(targetScale, 0.2, 4.0);
            } else {
                targetScale = 1.0;
            }

            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    for (const landmark of landmarks) {
                        canvasCtx.fillStyle = "#00ffcc";
                        canvasCtx.fillRect(landmark.x * canvasElement.width, landmark.y * canvasElement.height, 3, 3);
                    }
                }
            }
        }

        // --- 2. THREE.JS ENVIRONMENT SETUP ---
        function initThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 25;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            buildParticleSystem();
            window.addEventListener('resize', onWindowResize);
        }

        // --- 3. ALGORITHMIC 3D STRUCTURAL SHAPE GENERATORS ---
        function buildParticleSystem() {
            if (particleSystem) scene.remove(particleSystem);

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let x = 0, y = 0, z = 0;
                const i3 = i * 3;

                switch (activeShape) {
                    case "saturn":
                        if (i < PARTICLE_COUNT * 0.35) {
                            const u = Math.random();
                            const v = Math.random();
                            const theta = u * 2.0 * Math.PI;
                            const phi = Math.acos(2.0 * v - 1.0);
                            const r = Math.cbrt(Math.random()) * 3.8;
                            x = r * Math.sin(phi) * Math.cos(theta);
                            y = r * Math.sin(phi) * Math.sin(theta);
                            z = r * Math.cos(phi);
                        } else {
                            const r = 6.0 + Math.random() * 6.5;
                            const theta = Math.random() * Math.PI * 2;
                            x = Math.cos(theta) * r;
                            y = (Math.random() - 0.5) * 0.25;
                            z = Math.sin(theta) * r;
                        }
                        break;

                    case "heart":
                        const t = Math.random() * Math.PI * 2;
                        x = 16 * Math.pow(Math.sin(t), 3) * 0.45;
                        y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 0.45;
                        z = (Math.random() - 0.5) * 4.5 * (1.0 - Math.abs(t - Math.PI)/Math.PI);
                        y += 1.5; 
                        break;

                    case "flower":
                        const phiFlower = Math.random() * Math.PI * 2;
                        const thetaFlower = Math.random() * Math.PI;
                        const petals = 6;
                        const rFlower = 6.5 * Math.sin(petals * phiFlower) * Math.sin(thetaFlower);
                        x = rFlower * Math.sin(thetaFlower) * Math.cos(phiFlower);
                        y = rFlower * Math.sin(thetaFlower) * Math.sin(phiFlower);
                        z = rFlower * Math.cos(thetaFlower);
                        break;

                    case "fireworks":
                        const pRadius = Math.random() * 14.0;
                        const angle1 = Math.random() * Math.PI * 2;
                        const angle2 = Math.acos((Math.random() * 2) - 1);
                        x = pRadius * Math.sin(angle2) * Math.cos(angle1);
                        y = pRadius * Math.sin(angle2) * Math.sin(angle1);
                        z = pRadius * Math.cos(angle2);
                        break;

                    case "buddha":
                        const layer = Math.floor(Math.random() * 9);
                        const layerRadius = (9 - layer) * 1.3;
                        const ringAngle = Math.random() * Math.PI * 2;
                        x = Math.cos(ringAngle) * layerRadius;
                        y = (layer * 1.4) - 6;
                        z = Math.sin(ringAngle) * layerRadius;
                        if(Math.random() > 0.65) y += (Math.random() - 0.5) * 2.2;
                        break;

                    case "statue":
                        x = (Math.random() - 0.5) * 2.8;
                        y = (Math.random() - 0.5) * 15.0;
                        z = (Math.random() - 0.5) * 2.8;
                        const twist = y * 0.18;
                        const tx = x * Math.cos(twist) - z * Math.sin(twist);
                        const tz = x * Math.sin(twist) + z * Math.cos(twist);
                        x = tx; z = tz;
                        break;
                }

                positions[i3] = x;
                positions[i3 + 1] = y;
                positions[i3 + 2] = z;

                const distance = Math.sqrt(x*x + y*y + z*z);
                const mixedColor = baseColor.clone();
                mixedColor.addScalar((distance * 0.025) - 0.12);

                colors[i3] = mixedColor.r;
                colors[i3 + 1] = mixedColor.g;
                colors[i3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(8,8,0, 8,8,8);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad; ctx.fillRect(0,0,16,16);
            const texture = new THREE.CanvasTexture(canvas);

            const material = new THREE.PointsMaterial({
                size: 0.16,
                vertexColors: true,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                map: texture,
                sizeAttenuation: true
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
        }

        // --- 4. RENDER LOGIC ENGINE RUNTIME FRAME LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            currentScale += (targetScale - currentScale) * 0.1;
            
            if (particleSystem) {
                particleSystem.scale.setScalar(currentScale);
                particleSystem.rotation.y = time * 0.12;
                
                if (activeShape === "fireworks") {
                    particleSystem.rotation.y = time * 0.05;
                    particleSystem.scale.setScalar(currentScale * (1.0 + Math.sin(time * 3.5) * 0.22));
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 5. GLOBAL VIEWPORT CLICK TO FULLSCREEN ---
        container.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen()
                    .catch((err) => {
                        console.error(`Error enabling fullscreen mode: ${err.message}`);
                    });
            } else {
                document.exitFullscreen();
            }
        });

        // --- 6. USER INTERFACE EVENT LISTENERS ---
        document.getElementById('template-select').addEventListener('change', (e) => {
            activeShape = e.target.value;
            buildParticleSystem();
        });

        document.getElementById('color-picker').addEventListener('input', (e) => {
            baseColor.set(e.target.value);
            buildParticleSystem();
        });

        // Run Build Sequences
        initThree();
        window.addEventListener('load', initializeHandTracking);
        animate();
    </script>
</body>
</html>
